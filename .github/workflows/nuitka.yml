name: nuitka build

on:
  push:
  workflow_dispatch:

concurrency:
  group: nuitka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
            pkg: --onefile --windows-console-mode=attach --enable-plugin=upx --onefile-no-compression
          - os: ubuntu-latest
            suffix: linux
            pkg: --onefile --enable-plugin=upx --onefile-no-compression
          - os: macos-latest
            suffix: macos
            pkg: --standalone --macos-create-app-bundle --macos-app-name=holodori-profile-export
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka
          python -m pip install -r requirements.txt

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import holodori_profile_export as m; print(m.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx -y

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build (Nuitka)
        run: >
          python -m nuitka
          --lto=yes
          --python-flag=-O
          --remove-output
          ${{ matrix.pkg }}
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --output-dir=dist
          --output-filename=holodori-profile-export-${{ matrix.suffix }}
          --include-package=holodori_profile_export
          --include-package-data=holodori_profile_export
          --include-package-data=curl_cffi
          --include-package-data=customtkinter
          --company-name=HolodoriDB
          --product-name=holodori-profile-export
          --file-version=${{ steps.ver.outputs.version }}
          --product-version=${{ steps.ver.outputs.version }}
          main.py

      - name: Normalize app name (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d dist/*.app | head -n1)
          target=dist/holodori-profile-export-macos.app
          [ "$app" = "$target" ] || mv "$app" "$target"

      - uses: actions/upload-artifact@v4
        with:
          name: holodori-profile-export-${{ matrix.os }}
          path: dist/holodori-profile-export*
          if-no-files-found: error
