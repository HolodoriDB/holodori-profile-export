name: nuitka build

on:
  push:
  workflow_dispatch:

concurrency:
  group: nuitka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            upx: --enable-plugin=upx --onefile-no-compression
          - os: ubuntu-latest
            upx: ""
          - os: macos-latest
            upx: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka
          python -m pip install -r requirements.txt

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import holodori_profile_export as m; print(m.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx -y

      - name: Build (Nuitka onefile)
        run: >
          python -m nuitka
          --onefile
          --lto=yes
          --python-flag=-O
          ${{ matrix.upx }}
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --output-dir=dist
          --output-filename=holodori-profile-export
          --include-package=holodori_profile_export
          --include-package-data=holodori_profile_export
          --include-package-data=curl_cffi
          --include-package-data=customtkinter
          --company-name=HolodoriDB
          --product-name=holodori-profile-export
          --file-version=${{ steps.ver.outputs.version }}
          --product-version=${{ steps.ver.outputs.version }}
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: holodori-profile-export-${{ matrix.os }}
          path: dist/holodori-profile-export*
          if-no-files-found: error
